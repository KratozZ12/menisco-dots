# Configuracion de cava para el visualizador de la isla (lo lanza Visualizador.qml).
[general]
bars = 5
framerate = 60
autosens = 1
# Tras 1 s sin sonido cava deja de mandar datos: la isla lo toma como silencio.
sleep_timer = 1

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.7
